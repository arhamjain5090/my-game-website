<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Escape</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #080812;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #game {
        display: block;
        margin: 0 auto;
        background: #111122;
        border: 3px solid #4444ff;
        max-width: 100vw;
        max-height: 90vh;
    }

    #ui {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 800px;
        max-width: 90%;
        display: flex;
        justify-content: space-between;
        font-size: 18px;
        font-weight: bold;
        pointer-events: none;
        z-index: 5;
    }

    #message {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0,0,0,0.75);
        z-index: 10;
    }

    #box {
        text-align: center;
        background: #15152b;
        border: 2px solid #5555ff;
        border-radius: 15px;
        padding: 35px;
        box-shadow: 0 0 40px #3333ff55;
    }

    h1 {
        color: #55ffff;
        font-size: 45px;
        margin: 0 0 10px;
        text-shadow: 0 0 15px #00ffff;
    }

    button {
        margin-top: 20px;
        padding: 13px 35px;
        border: none;
        border-radius: 8px;
        background: #4444ff;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #6666ff;
    }
</style>
</head>

<body>

<div id="ui">
    <div>❤️ <span id="health">100</span></div>
    <div>🪙 Score: <span id="score">0</span></div>
</div>

<canvas id="game" width="800" height="500"></canvas>

<div id="message">
    <div id="box">
        <h1>NEON ESCAPE</h1>
        <p>Collect the coins and reach the green portal.</p>
        <p>Use <b>WASD</b> or <b>Arrow Keys</b> to move.</p>
        <button onclick="startGame()">PLAY</button>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const healthText = document.getElementById("health");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");
const box = document.getElementById("box");

let keys = {};
let player;
let coins;
let enemies;
let score;
let health;
let gameRunning = false;

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function startGame() {

    player = {
        x: 60,
        y: 220,
        size: 30,
        speed: 4
    };

    coins = [
        {x: 180, y: 100},
        {x: 350, y: 380},
        {x: 550, y: 130},
        {x: 680, y: 350}
    ];

    enemies = [
        {x: 300, y: 150, size: 30, speed: 2},
        {x: 500, y: 300, size: 30, speed: 2.3},
        {x: 650, y: 180, size: 30, speed: 1.7}
    ];

    score = 0;
    health = 100;

    updateUI();

    gameRunning = true;
    message.style.display = "none";

    gameLoop();
}

function updateUI() {
    healthText.textContent = health;
    scoreText.textContent = score;
}

function distance(a, b) {
    return Math.sqrt(
        (a.x - b.x) ** 2 +
        (a.y - b.y) ** 2
    );
}

function update() {

    // PLAYER MOVEMENT
    if (keys["w"] || keys["arrowup"])
        player.y -= player.speed;

    if (keys["s"] || keys["arrowdown"])
        player.y += player.speed;

    if (keys["a"] || keys["arrowleft"])
        player.x -= player.speed;

    if (keys["d"] || keys["arrowright"])
        player.x += player.speed;

    // Keep player inside map
    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));


    // COLLECT COINS
    coins = coins.filter(coin => {

        if (distance(player, coin) < 30) {
            score += 10;
            updateUI();
            return false;
        }

        return true;
    });


    // ENEMY AI
    enemies.forEach(enemy => {

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 1) {
            enemy.x += dx / dist * enemy.speed;
            enemy.y += dy / dist * enemy.speed;
        }

        // Enemy hits player
        if (distance(player, enemy) < 30) {
            health -= 0.5;

            if (health <= 0) {
                health = 0;
                updateUI();
                endGame(false);
            }

            updateUI();
        }
    });


    // WIN CONDITION
    if (
        player.x > 735 &&
        player.y > 415
    ) {
        endGame(true);
    }
}

function draw() {

    // BACKGROUND
    ctx.fillStyle = "#0b0b18";
    ctx.fillRect(0, 0, canvas.width, canvas.height);


    // GRID
    ctx.strokeStyle = "#202044";
    ctx.lineWidth = 1;

    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }


    // PORTAL
    ctx.fillStyle = "#00ff88";
    ctx.shadowColor = "#00ff88";
    ctx.shadowBlur = 25;

    ctx.beginPath();
    ctx.arc(765, 445, 25, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;


    // COINS
    coins.forEach(coin => {

        ctx.fillStyle = "#ffd900";
        ctx.shadowColor = "#ffd900";
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.arc(coin.x, coin.y, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
    });


    // ENEMIES
    enemies.forEach(enemy => {

        ctx.fillStyle = "#ff3355";
        ctx.shadowColor = "#ff3355";
        ctx.shadowBlur = 15;

        ctx.fillRect(
            enemy.x,
            enemy.y,
            enemy.size,
            enemy.size
        );

        ctx.shadowBlur = 0;
    });


    // PLAYER
    ctx.fillStyle = "#00d9ff";
    ctx.shadowColor = "#00d9ff";
    ctx.shadowBlur = 20;

    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

    ctx.shadowBlur = 0;
}

function gameLoop() {

    if (!gameRunning) return;

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

function endGame(won) {

    gameRunning = false;

    message.style.display = "flex";

    if (won) {

        box.innerHTML = `
            <h1 style="color:#00ff88">YOU WIN!</h1>
            <p>You escaped the enemies.</p>
            <p>Score: <b>${score}</b></p>
            <button onclick="startGame()">PLAY AGAIN</button>
        `;

    } else {

        box.innerHTML = `
            <h1 style="color:#ff3355">GAME OVER</h1>
            <p>The enemies caught you.</p>
            <p>Score: <b>${score}</b></p>
            <button onclick="startGame()">TRY AGAIN</button>
        `;
    }
}
</script>

</body>
</html>
